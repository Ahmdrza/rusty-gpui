[package]
repository.workspace = true
name = "rusty-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
documentation = "https://docs.rs/rusty-gpui"
readme = "README.md"
include = ["src/**", "assets/**", "examples/**", "README.md", "LICENSE"]
keywords = ["design-system", "theme", "gui"]
categories = ["gui"]
description = "Rusty GPUI native GPUI components and theme integration"

[dependencies]
rusty-gpui-theme.workspace = true
gpui.workspace = true
gpui-component.workspace = true
rust-embed = "=8.13.0"

# Native Metal needs no Linux backends. Preserve both Linux display protocols.
[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { workspace = true, features = ["windows-manifest"] }

# GPUI otherwise substitutes NoopTextSystem on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, features = ["font-kit"] }
