name: Native checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RustSec auditor
        run: cargo install cargo-audit --locked
      - name: Audit locked dependencies
        run: cargo audit --json > audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-advisories
          path: audit.json
          if-no-files-found: warn
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libssl-dev libudev-dev libfontconfig1-dev libfreetype6-dev libglib2.0-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shm0-dev libxcb-xinput-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev
      - name: Find macOS Metal compiler
        if: runner.os == 'macOS'
        run: xcrun --find metal || xcodebuild -downloadComponent MetalToolchain
      - run: cargo fmt -p rusty-gpui-theme -p rusty-gpui -p rusty-gpui-gallery -p rusty-gpui-settings --check
      - run: cargo check --locked --workspace
      - run: cargo check --locked -p rusty-gpui --examples
      - run: cargo test --locked -p rusty-gpui-theme
      - run: cargo test --locked -p rusty-gpui-gallery
      - run: cargo test --locked -p rusty-gpui-settings
      - run: cargo test --locked -p rusty-gpui --doc
